name: Deploy static build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:pages
        env:
          # Publishable/anon keys — meant to be public, safe to bake into a static client build.
          VITE_SUPABASE_URL: https://nqnydvrrjhibdthctoyq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ZMFmwvIfFfTU6jEnq7Wk0g_7XkONktL
          VITE_SUPABASE_PROJECT_ID: nqnydvrrjhibdthctoyq
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prodbuild

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
